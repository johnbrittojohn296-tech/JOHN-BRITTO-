```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCart - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-left">
            <div class="brand">
                🛒 SmartCart
            </div>

            <h1>Welcome Back!</h1>

            <p>
                Shop smarter, live better.
                Login to explore your favourite products
                and manage your shopping easily.
            </p>

            <div class="shopping-icon">🛍️</div>
        </div>

        <div class="login-right">

            <h2>Login to SmartCart</h2>
            <p class="subtitle">Enter your details to continue</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >Show</button>
                    </div>
                </div>

                <p id="loginMessage" role="status"></p>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
```
